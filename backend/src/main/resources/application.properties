# Server Configuration
server.port=8080

# WebSocket Configuration
spring.webflux.base-path=/

# CORS Configuration
spring.webflux.cors.allowed-origins=http://localhost:5173
spring.webflux.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.webflux.cors.allowed-headers=*
spring.webflux.cors.allow-credentials=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.audiovisualizer=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.reactor.netty=DEBUG

# Application Configuration
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.api-url=https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:streamGenerateContent

# WebSocket Settings
spring.reactor.netty.shutdown-quiet-period=2s
spring.reactor.netty.shutdown-timeout=15s
